</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <!-- ===== NAV ===== -->
  <header class="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="index.html">
        <span class="dot"></span> MR BENIMARU
      </a>
      <button class="nav__toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">☰</button>
      <ul class="nav__links" id="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="inspiration.html" data-i18n="nav.inspiration">Inspiration</a></li>
        <li><a href="collection.html" data-i18n="nav.collection">Interaction</a></li>
        <li><a href="whitelist.html" data-i18n="nav.whitelist">Whitelist</a></li>
        <li><a href="https://x.com/MrBenimarusays" target="_blank" rel="noopener">X / Twitter</a></li>
      </ul>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to Japanese" title="日本語 / English">
        <span class="lang-toggle__flag">🇯🇵</span>
        <span class="lang-toggle__label">日本語</span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ambient liquid bubbles behind the page head — decorative, hidden without js/goo.js -->
    <div class="page-goo" aria-hidden="true"><div class="page-goo__field"><i></i><i></i><i></i></div></div>
    <div class="page-head wrap">
      <p class="eyebrow" data-i18n="col.eyebrow">A peek behind the door</p>
      <h1 data-i18n="col.h1">Interaction</h1>
      <p class="lead center" style="margin-inline:auto;" data-i18n="col.lead">
        Find the matching pairs.
      </p>
    </div>

    <section class="section" style="padding-top:1rem;">
      <div class="wrap">
        <div class="karuta-bar">
          <p class="karuta-status" id="karuta-status" aria-live="polite" data-i18n="col.status">Memorize the cards…</p>
          <!-- goo buttons: data-i18n lives on the inner label span — i18n.js swaps
               innerHTML, which would wipe the goo layer if it sat on the button -->
          <button class="btn btn--purple btn--goo" id="karuta-restart" type="button">
            <span class="btn__goo" aria-hidden="true"><span class="btn__goo-pill"></span><i></i><i></i><i></i></span>
            <span class="btn__label" data-i18n="col.newgame">New Game</span>
          </button>
        </div>
        <!-- Cards are built by js/karuta.js from the costume image pool -->
        <div class="grid karuta-board" id="karuta-board" aria-label="Memory matching game"></div>

        <div class="center" style="margin-top:2.8rem;">
          <p class="lead center" style="margin-inline:auto;" data-i18n="col.cta">Like what you see? The door is open.</p>
          <a class="btn btn--purple btn--goo" href="whitelist.html">
            <span class="btn__goo" aria-hidden="true"><span class="btn__goo-pill"></span><i></i><i></i><i></i></span>
            <span class="btn__label" data-i18n="cta.whitelist">Join the Whitelist</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- lightbox overlay -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="Close">✕</button>
    <img src="" alt="" />
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer__inner wrap">
      <div class="footer__id">
        <div>
          <a href="index.html" class="nav__brand"><span class="dot"></span> MR BENIMARU</a>
          <p class="muted" style="margin:.4rem 0 0;" data-i18n="footer.copy">© 2026 Wabi Sabi Corporation.</p>
        </div>
        <span class="hanko" aria-hidden="true">紅丸</span>
      </div>
      <nav class="footer__social" aria-label="Social links">
        <a href="https://x.com/MrBenimarusays" target="_blank" rel="noopener">X / Twitter</a>
      </nav>
    </div>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/goo.js"></script>
  <script src="js/karuta.js"></script>
</body>
</html>
